<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <script>
      (function () {
        const storageKey = "buildingai-client-theme";
        const colorStorageKey = "buildingai-client-theme-color";

        const theme = localStorage.getItem(storageKey) || "system";
        if (
          theme === "dark" ||
          (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.add("light");
        }

        const themeColor = localStorage.getItem(colorStorageKey) || "indigo";
        document.documentElement.classList.add("theme-" + themeColor);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- React Fast Refresh 运行时：plugin-react 6 在 rolldown-vite 下不会自动注入，手动内联（仅 dev 生效，构建产物不含 /@react-refresh） -->
    <script type="module">
      import RefreshRuntime from "/@react-refresh";
      RefreshRuntime.injectIntoGlobalHook(window);
      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => (type) => type;
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
